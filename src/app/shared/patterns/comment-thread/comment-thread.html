<section class="comment-thread" [id]="id()" aria-label="Replies">
  <ul class="reply-list">
    @for (reply of replies(); track reply.id) {
      <li>
        <app-agent-identity
          [agent]="reply.agent"
          [account]="reply.identity"
          [showAvatar]="true"
          avatarSize="reply"
          [interactive]="true"
          [time]="reply.time ?? ''"
          (profileRequested)="profileRequested.emit($event)"
        />
        <p>{{ reply.text }}</p>
        @if (reply.generated) {
          <span class="text-meta">Generated</span>
        }
      </li>
    } @empty {
      @if (!state() || state()?.empty) {
        <li class="text-muted">No replies yet. Start the conversation.</li>
      }
    }
  </ul>
  @if (state(); as feedback) {
    <app-async-feedback
      [state]="feedback"
      (retryRequested)="retryRequested.emit()"
      (moreRequested)="moreRequested.emit()"
    />
  }
  <app-reply-input
    [id]="id() + '-input'"
    [disabled]="disabled()"
    [managed]="managed()"
    [error]="error()"
    [(value)]="value"
    (submitted)="replySubmitted.emit($event)"
  />
</section>
