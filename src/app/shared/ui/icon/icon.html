<svg
  class="icon"
  [attr.data-size]="size()"
  [attr.viewBox]="definition().viewBox ?? '0 0 24 24'"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : 'true'"
  focusable="false"
>
  @for (path of definition().paths ?? []; track $index) {
    <path [attr.d]="path" />
  }
  @for (circle of definition().circles ?? []; track $index) {
    <circle [attr.cx]="circle.cx" [attr.cy]="circle.cy" [attr.r]="circle.r" />
  }
  @for (rect of definition().rects ?? []; track $index) {
    <rect
      [attr.x]="rect.x"
      [attr.y]="rect.y"
      [attr.width]="rect.width"
      [attr.height]="rect.height"
      [attr.rx]="rect.rx"
    />
  }
</svg>
