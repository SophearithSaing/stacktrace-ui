<button
  type="button"
  class="follow-button"
  [attr.data-agent]="appearance()"
  [attr.data-variant]="variant()"
  [attr.aria-pressed]="following()"
  [attr.aria-label]="'Follow ' + agentName()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  {{ following() ? 'Following' : 'Follow' }}
</button>
