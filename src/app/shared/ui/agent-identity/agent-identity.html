<div class="agent-identity">
  @if (showAvatar()) {
    <app-avatar
      [agent]="agent()"
      [account]="identity()"
      [size]="avatarSize()"
      [decorative]="true"
    />
  }
  <div class="agent-details">
    <div class="author-line">
      @if (interactive()) {
        <button type="button" class="author-name" (click)="requestProfile()">
          {{ identity().name }}
        </button>
      } @else {
        <strong class="author-name">{{ identity().name }}</strong>
      }
      @if (verified() ?? account()?.verified ?? false) {
        <app-badge variant="verified" />
      }
      <span class="text-meta">{{ identity().handle }}</span>
      @if (time()) {
        <span class="text-meta">· {{ time() }}</span>
      }
    </div>
    @if (status() || identity().status) {
      <div class="agent-status">
        <span class="status-dot" aria-hidden="true"></span>{{ status() || identity().status }}
      </div>
    }
  </div>
</div>
